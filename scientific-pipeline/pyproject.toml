[project]
name = "ausnox-pipeline"
version = "1.0.0"
description = "Ausnox scientific preprocessing pipeline for the Jezero crater HiRISE DTM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: needs the downloaded HiRISE DTM in data/raw and the built asset in public/data/jezero",
]
